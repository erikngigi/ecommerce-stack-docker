services:
  # Magento
  magento:
    image: ghcr.io/erikngigi/magento:latest
    hostname: magento
    container_name: magento
    restart: unless-stopped
    tty: true
    volumes:
      # Application Source Code Bind Mount
      - ./src/magento:/home/appuser/magento2:cached

      # Health/Info Diagnostic Tools
      - ./magento/templates/diagnostics/info.php:/home/appuser/tools/info.php:ro

      # Configuration Files
      - ./magento/settings/php/php.ini-development:/usr/local/etc/php/php.ini:ro
      - ./magento/settings/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./magento/settings/php-fpm/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    ports:
      - "9000:9000"
    networks:
      - ecommerce-network
  # Akeneo
  akeneo:
    image: ghcr.io/erikngigi/akeneo:latest
    hostname: akeneo
    container_name: akeneo
    restart: unless-stopped
    tty: true
    volumes:
      # Application Source Code Bind Mount
      - ./src/akeneo:/home/appuser/akeneo7:cached

      # Health/Info Diagnostic Tools
      - ./akeneo/templates/diagnostics/info.php:/home/appuser/tools/info.php:ro

      # Configuration Files
      - ./akeneo/settings/php/php.ini-development:/usr/local/etc/php/php.ini:ro
      - ./akeneo/settings/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./akeneo/settings/php-fpm/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    ports:
      - "9050:9050"
    networks:
      - ecommerce-network
    depends_on:
      - akeneo-db
  # Akeneo Database
  akeneo-db:
    image: mysql:8.0.30
    hostname: akeneo-db
    container_name: akeneo-db
    restart: unless-stopped
    tty: true
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${AKENEO_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AKENEO_DATABASE}
      MYSQL_USER: ${AKENEO_USER}
      MYSQL_PASSWORD: ${AKENEO_DB_USER_PASSWORD}
    networks:
      - ecommerce-network
    volumes:
      - akeneo-db-data:/var/lib/mysql/
      - ./mysql/settings/my.cnf:/etc/mysql/conf.d/my.cnf:ro
  # Elastisearch
  elasticsearch:
    image: elasticsearch:8.4.2
    hostname: akeneo-es
    container_name: akeneo-es
    ports:
      - "9100:9200"
    networks:
      - ecommerce-network
    volumes:
      - ./elasticsearch/settings/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./elasticsearch/settings/jvm.options:/usr/share/elasticsearch/config/jvm.options.d/jvm.options
      - akeneo-es-data:/usr/share/elasticsearch/data
    depends_on:
      - akeneo-db
networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge
volumes:
  akeneo-db-data:
    name: akeneo-mysql-db
    driver: local
  akeneo-es-data:
    name: akeneo-elasticsearch-volume
    driver: local
