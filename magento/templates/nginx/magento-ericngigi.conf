# 1. Upstream pointing to your Docker PHP-FPM container on port 9000
upstream fastcgi_backend {
    server 127.0.0.1:9000;
}

# 2. Redirect HTTP to HTTPS
server {
    listen 80;
    server_name magento.ericngigi.com;
    return 301 https://$host$request_uri;
}

# 3. Main HTTPS Server Block
server {
    listen 443 ssl http2;
    server_name magento.ericngigi.com;

    # Set root paths (Fixed: Added /magento2 to match container structure)
    set $MAGE_ROOT /home/eric/ecommerce-stack-docker/src/magento;
    set $MAGE_MODE developer;

    # Nginx checks local host files in /pub
    root $MAGE_ROOT/pub;
    index index.php;

    client_max_body_size 25m;

    access_log /var/log/nginx/magento.ericngigi.access.log;
    error_log  /var/log/nginx/magento.ericngigi.error.log;

    # TLS Configuration
    ssl_certificate /etc/letsencrypt/live/magento.ericngigi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magento.ericngigi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    # Handle static files directly on Host
    location /static/ {
        expires max;
        log_not_found off;
        add_header Cache-Control "public";

        location ~ ^/static/version\d*/ {
            rewrite ^/static/version\d*/(.*)$ /static/$1 last;
        }

        location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2|html|json)$ {
            if (!-f $request_filename) {
                rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
            }
            expires +1y;
            add_header Cache-Control "public";
        }

        if (!-f $request_filename) {
            rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
        }
    }

    # Route media files
    location /media/ {
        try_files $uri $uri/ /get.php$is_args$args;
    }

    # Default location block
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Explicitly proxy static.php, get.php, and index.php requests to PHP-FPM
    location ~ ^/(index|get|static|errors/report|errors/404|errors/503|health_check)\.php$ {
        try_files $uri =404;
        fastcgi_pass fastcgi_backend;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /home/appuser/magento2/pub$fastcgi_script_name;
        fastcgi_param MAGE_MODE $MAGE_MODE;
        
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Fallback block for all other PHP files
    location ~ \.php$ {
        fastcgi_pass fastcgi_backend;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /home/appuser/magento2/pub$fastcgi_script_name;
        fastcgi_param MAGE_MODE $MAGE_MODE;
        
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Status & Diagnostic endpoints
    location = /status {
        access_log off;
        allow 127.0.0.1;
        allow 105.163.157.96;
        deny all;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass fastcgi_backend;
    }

    location = /info.php {
        access_log off;
        allow 127.0.0.1;
        allow 105.163.157.96;
        deny all;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/appuser/tools$fastcgi_script_name;
        fastcgi_pass fastcgi_backend;
    }
}
