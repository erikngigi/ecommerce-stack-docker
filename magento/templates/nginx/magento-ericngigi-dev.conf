# 1. Upstream pointing to your Docker PHP-FPM container on port 9000
upstream fastcgi_backend {
    server 127.0.0.1:9000;
}

# 2. Redirect HTTP to HTTPS
server {
    listen 80;
    server_name magento.ericngigi.com;
    return 301 https://$host$request_uri;
}

# 3. Main HTTPS Server Block
server {
    listen 443 ssl http2;
    server_name magento.ericngigi.com;

    # Set root paths (Fixed: Added /magento2 to match container structure)
    set $MAGE_ROOT /home/eric/ecommerce-stack-docker/src/magento;
    include /home/eric/ecommerce-stack-docker/src/magento/nginx.conf.sample;

    access_log /var/log/nginx/magento.ericngigi.access.log;
    error_log  /var/log/nginx/magento.ericngigi.error.log;
    
    client_max_body_size 25m;

    # TLS Configuration
    ssl_certificate /etc/letsencrypt/live/magento.ericngigi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magento.ericngigi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
}
